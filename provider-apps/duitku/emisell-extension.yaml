schema_version: "1"
provider:
  code: duitku
  name: Duitku
release:
  version: emisell-duitku-v2.0.1
connector:
  contract_version: v1
  runtime: isolated_container
  sdk_version: v1
operations:
  - verify_installation
  - disable_installation
  - create_payment
  - create_hosted_checkout
  - get_payment
  - handle_webhook
credentials:
  fields:
    - code: merchant_code
      label: Merchant code
      input_type: text
      secret: false
      required: true
    - code: api_key
      label: API key
      input_type: password
      secret: true
      required: true
certification_profiles:
  qris: {code: duitku-pop-v2/qris, automated: true}
  card: {code: duitku-pop-v2/card, automated: true}
  va_bca: {code: duitku-pop-v2/va_bca, automated: true}
  va_mandiri: {code: duitku-pop-v2/va_mandiri, automated: true}
  va_bni: {code: duitku-pop-v2/va_bni, automated: true}
  va_bri: {code: duitku-pop-v2/va_bri, automated: true}
  va_permata: {code: duitku-pop-v2/va_permata, automated: true}
  va_cimb: {code: duitku-pop-v2/va_cimb, automated: true}
  va_danamon: {code: duitku-pop-v2/va_danamon, automated: true}
  va_bsi: {code: duitku-pop-v2/va_bsi, automated: true}
  va_maybank: {code: duitku-pop-v2/va_maybank, automated: true}
  va_bnc: {code: duitku-pop-v2/va_bnc, automated: true}
  va_atm_bersama: {code: duitku-pop-v2/va_atm_bersama, automated: true}
  va_arta_graha: {code: duitku-pop-v2/va_arta_graha, automated: true}
  va_sahabat_sampoerna: {code: duitku-pop-v2/va_sahabat_sampoerna, automated: true}
  ewallet_ovo: {code: duitku-pop-v2/ewallet_ovo, automated: true}
  ewallet_dana: {code: duitku-pop-v2/ewallet_dana, automated: true}
  ewallet_shopeepay: {code: duitku-pop-v2/ewallet_shopeepay, automated: true}
  ewallet_linkaja: {code: duitku-pop-v2/ewallet_linkaja, automated: true}
  retail_alfamart: {code: duitku-pop-v2/retail_alfamart, automated: true}
  retail_indomaret: {code: duitku-pop-v2/retail_indomaret, automated: true}
  retail_pegadaian_pos: {code: duitku-pop-v2/retail_pegadaian_pos, automated: true}
  paylater_indodana: {code: duitku-pop-v2/paylater_indodana, automated: true}
  paylater_atome: {code: duitku-pop-v2/paylater_atome, automated: true}
  digital_banking_jenius: {code: duitku-pop-v2/digital_banking_jenius, automated: true}
environments:
  - code: live
    label: Live
    description: Transaksi diteruskan ke Duitku production.
  - code: sandbox
    label: Sandbox
    description: Pengujian credential dan transaksi Duitku tanpa transaksi production.
payment_methods:
  - qris
  - card
  - va_bca
  - va_mandiri
  - va_bni
  - va_bri
  - va_permata
  - va_cimb
  - va_danamon
  - va_bsi
  - va_maybank
  - va_bnc
  - va_atm_bersama
  - va_arta_graha
  - va_sahabat_sampoerna
  - ewallet_ovo
  - ewallet_dana
  - ewallet_shopeepay
  - ewallet_linkaja
  - retail_alfamart
  - retail_indomaret
  - retail_pegadaian_pos
  - paylater_indodana
  - paylater_atome
  - digital_banking_jenius
outbound_hosts:
  - api-sandbox.duitku.com
  - api-prod.duitku.com
  - sandbox.duitku.com
  - passport.duitku.com
