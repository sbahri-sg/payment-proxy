$kind: http-request
description: Mencari provider berdasarkan code atau name secara case-insensitive. Kosongkan provider_search untuk seluruh katalog; Dashboard Emisell memakai debounce 300-500 ms.
url: "{{base_url}}/api/v1/providers?q={{provider_search}}"
method: GET
headers:
  X-Emisell-Merchant-ID: "{{merchant_id}}"
examples: ./.resources/List providers.resources/examples
order: 1000
