$kind: http-request
url: "{{base_url}}/api/v1/payment-sessions"
method: POST
headers:
  X-Emisell-Merchant-ID: "{{merchant_id}}"
  Idempotency-Key: checkout-{{$guid}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "payment_method_id": "{{payment_method_id}}",
      "checkout_mode": "provider_hosted",
      "merchant_reference": "order_{{$timestamp}}",
      "amount": 1000000,
      "currency": "IDR",
      "description": "Emisell order checkout",
      "customer": {"name": "Budi Santoso", "email": "budi@example.com"},
      "return_url": "https://shop.example/payments/return",
      "metadata": {
        "source": "postman-provider-hosted"
      }
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Provider checkout created', () => pm.expect([200, 201, 202]).to.include(pm.response.code));
      if ([200, 201].includes(pm.response.code)) {
        const data = pm.response.json().data;
        const payment = data.payment || data;
        pm.expect(payment.checkout_mode).to.eql('provider_hosted');
        pm.expect(payment.checkout_url).to.match(/^https:\/\//);
        pm.expect(payment.next_action.type).to.eql('redirect');
        pm.collectionVariables.set('payment_id', payment.id);
      }
    language: text/javascript
examples: ./.resources/Create provider hosted checkout.resources/examples
order: 1000
