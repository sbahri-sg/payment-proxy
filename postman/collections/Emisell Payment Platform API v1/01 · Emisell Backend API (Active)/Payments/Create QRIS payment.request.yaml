$kind: http-request
url: "{{base_url}}/api/v1/payment-sessions"
method: POST
headers:
  X-Emisell-Merchant-ID: "{{merchant_id}}"
  X-Emisell-Execution-Mode: "{{execution_mode}}"
  Idempotency-Key: checkout-{{$guid}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "payment_option_id": "{{payment_option_id}}",
      "merchant_reference": "order_{{$timestamp}}",
      "amount": 1000000,
      "currency": "IDR",
      "confirm": true,
      "capture_method": "automatic",
      "payment_method_data": {
        "real_time_payment": {
          "qris": {}
        }
      },
      "return_url": "https://shop.example/payments/return",
      "metadata": {
        "source": "postman"
      }
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Payment accepted', () => pm.expect([200, 201, 202]).to.include(pm.response.code));
      if ([200, 201].includes(pm.response.code)) {
        const data = pm.response.json().data;
        const payment = data.payment || data;
        pm.collectionVariables.set('payment_id', payment.id);
      }
    language: text/javascript
examples: ./.resources/Create QRIS payment.resources/examples
order: 1000
