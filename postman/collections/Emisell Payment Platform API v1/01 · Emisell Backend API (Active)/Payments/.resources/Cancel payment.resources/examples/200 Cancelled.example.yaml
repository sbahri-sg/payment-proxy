  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": {
          "id": "pay_01k3...",
          "installation_id": "ins_01k3...",
          "provider_code": "xendit",
          "amount": 1000000,
          "currency": "IDR",
          "status": "CANCELLED",
          "provider_payment_id": "pay_engine_..."
        }
      }
order: 1000
