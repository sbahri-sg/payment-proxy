$kind: http-example
request:
  url: "{{base_url}}/api/v1/payment-sessions"
  method: POST
  headers:
    X-Emisell-Merchant-ID: "{{merchant_id}}"
    X-Emisell-Execution-Mode: "{{execution_mode}}"
    Idempotency-Key: checkout-{{$guid}}
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "installation_id": "{{installation_id}}",
        "checkout_mode": "provider_hosted",
        "merchant_reference": "order_{{$timestamp}}",
        "amount": 1000000,
        "currency": "IDR",
        "description": "Emisell order checkout",
        "return_url": "https://shop.example/payments/return",
        "metadata": {
          "source": "postman-provider-hosted"
        }
      }
response:
  statusCode: 202
  statusText: Accepted
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "OUTCOME_UNKNOWN",
          "message": "payment engine outcome is unknown; query the resource before retrying"
        },
        "data": {
          "id": "pay_01k3...",
          "status": "UNKNOWN"
        }
      }
order: 2000
