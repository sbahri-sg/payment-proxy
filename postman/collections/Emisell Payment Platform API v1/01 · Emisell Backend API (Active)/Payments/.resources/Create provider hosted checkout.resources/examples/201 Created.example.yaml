$kind: http-example
request:
  url: "{{base_url}}/api/v1/payment-sessions"
  method: POST
  headers:
    X-Emisell-Merchant-ID: "{{merchant_id}}"
    Idempotency-Key: checkout-{{$guid}}
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "payment_method_id": "{{payment_method_id}}",
        "checkout_mode": "provider_hosted",
        "merchant_reference": "order_{{$timestamp}}",
        "amount": 1000000,
        "currency": "IDR",
        "description": "Emisell order checkout",
        "customer": {"name": "Budi Santoso", "email": "budi@example.com"},
        "return_url": "https://shop.example/payments/return",
        "metadata": {
          "source": "postman-provider-hosted"
        }
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": {
          "payment": {
            "id": "pay_01k3...",
            "installation_id": "ins_01k3...",
            "payment_method_id": "pmo_01k3...",
            "payment_method_code": "qris",
            "checkout_mode": "provider_hosted",
            "provider_code": "xendit",
            "environment": "sandbox",
            "merchant_reference": "order_2026_0001",
            "amount": 1000000,
            "currency": "IDR",
            "status": "PENDING",
            "provider_payment_id": "ps-6a915387...",
            "checkout_url": "https://dev.xen.to/...",
            "next_action": {
              "type": "redirect",
              "redirect_url": "https://dev.xen.to/..."
            }
          }
        }
      }
order: 1000
