$kind: http-example
request:
  url: "{{base_url}}/api/v1/payment-sessions"
  method: POST
  headers:
    X-Emisell-Merchant-ID: "{{merchant_id}}"
    X-Emisell-Execution-Mode: "{{execution_mode}}"
    Idempotency-Key: checkout-{{$guid}}
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "payment_option_id": "{{payment_option_id}}",
        "merchant_reference": "order_{{$timestamp}}",
        "amount": 1000000,
        "currency": "IDR",
        "confirm": true,
        "capture_method": "automatic",
        "payment_method_data": {
          "real_time_payment": {
            "qris": {}
          }
        },
        "return_url": "https://shop.example/payments/return",
        "metadata": {
          "source": "postman"
        }
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": {
          "payment": {
            "id": "pay_01k3...",
            "payment_option_id": "pmo_01k3...",
            "installation_id": "ins_01k3...",
            "provider_code": "xendit",
            "environment": "sandbox",
            "merchant_reference": "order_2026_0001",
            "amount": 1000000,
            "currency": "IDR",
            "status": "PENDING",
            "provider_payment_id": "pay_engine_...",
            "next_action": {
              "type": "qr_code_url",
              "url": "https://..."
            }
          },
          "client_secret": "pay_engine_..._secret_..."
        }
      }
order: 1000
