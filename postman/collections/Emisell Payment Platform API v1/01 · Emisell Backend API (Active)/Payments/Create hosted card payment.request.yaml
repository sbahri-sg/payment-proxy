$kind: http-request
description: Set card_payment_option_id dari assignment card yang ACTIVE. Response berisi hosted Xendit redirect_url. Jangan pernah menambahkan nomor kartu, expiry, CVV/CVN, atau OTP ke request ini; input tersebut hanya dilakukan pelanggan pada domain checkout Xendit.
url: "{{base_url}}/api/v1/payment-sessions"
method: POST
headers:
  X-Emisell-Merchant-ID: "{{merchant_id}}"
  X-Emisell-Execution-Mode: "{{execution_mode}}"
  Idempotency-Key: checkout-card-{{$guid}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "payment_option_id": "{{card_payment_option_id}}",
      "merchant_reference": "card-order-{{$timestamp}}",
      "amount": 1000000,
      "currency": "IDR",
      "description": "Hosted card sandbox payment",
      "customer": {
        "name": "Budi Santoso",
        "email": "budi@example.com"
      },
      "return_url": "https://shop.example/payments/return",
      "metadata": {
        "source": "postman-card-hosted"
      }
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Hosted card session created', () => pm.expect([200, 201]).to.include(pm.response.code));
      if ([200, 201].includes(pm.response.code)) {
        const data = pm.response.json().data;
        const payment = data.payment || data;
        pm.expect(payment.provider_payment_id).to.match(/^ps-/);
        pm.expect(payment.next_action.type).to.eql('redirect');
        pm.collectionVariables.set('card_payment_id', payment.id);
      }
    language: text/javascript
examples: ./.resources/Create hosted card payment.resources/examples
order: 3000
