$kind: http-request
description: Membuat atau memindahkan QRIS ke satu gateway aktif pada environment merchant. Kirim version terakhir untuk optimistic concurrency.
url: "{{base_url}}/api/v1/payment-method-assignments"
method: PUT
headers:
  X-Emisell-Merchant-ID: "{{merchant_id}}"
  X-Emisell-Execution-Mode: "{{execution_mode}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "installation_id": "{{installation_id}}",
      "payment_method_code": "{{payment_method_code}}",
      "label": "QRIS",
      "version": {{payment_option_version}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Payment method assigned', () => pm.expect([200, 201]).to.include(pm.response.code));
      if ([200, 201].includes(pm.response.code)) {
        const data = pm.response.json().data;
        pm.collectionVariables.set('payment_option_id', data.id);
        pm.collectionVariables.set('payment_option_version', String(data.version));
      }
    language: text/javascript
examples: ./.resources/2. Assign master method to active gateway.resources/examples
order: 2000
