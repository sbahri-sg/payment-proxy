$kind: http-request
description: Membuat atau memindahkan 1-50 payment method DOCUMENTED atau CERTIFIED secara atomic. DISABLED tetap ditolak dan satu item gagal membatalkan seluruh batch.
url: "{{base_url}}/api/v1/payment-method-assignments"
method: PUT
headers:
  X-Emisell-Merchant-ID: "{{merchant_id}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "assignments": [{
        "installation_id": "{{installation_id}}",
        "payment_method_code": "{{payment_method_code}}",
        "version": {{payment_option_version}}
      }]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Payment methods assigned atomically', () => pm.expect(pm.response.code).to.eql(200));
      if (pm.response.code === 200) {
        const items = pm.response.json().data || [];
        const selected = items.find((item) => item.payment_method_code === pm.collectionVariables.get('payment_method_code')) || items[0];
        if (selected) {
          pm.collectionVariables.set('payment_option_id', selected.id);
          pm.collectionVariables.set('payment_option_version', String(selected.version));
        }
      }
    language: text/javascript
examples: ./.resources/2. Assign master method to active gateway.resources/examples
order: 2000
