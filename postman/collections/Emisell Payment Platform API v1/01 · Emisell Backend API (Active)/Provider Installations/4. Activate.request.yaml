$kind: http-request
url: "{{base_url}}/api/v1/provider-installations/{{installation_id}}/activate"
method: POST
headers:
  X-Emisell-Merchant-ID: "{{merchant_id}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "version": {{installation_version}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Installation active', () => pm.expect(pm.response.json().data.status).to.eql('ACTIVE'));
      if (pm.response.code === 200) pm.collectionVariables.set('installation_version', String(pm.response.json().data.version));
    language: text/javascript
examples: ./.resources/4. Activate.resources/examples
order: 4000
