$kind: http-request
description: Credential diverifikasi langsung ke provider dan dienkripsi AES-256-GCM di vault Emisell. Atur topik Payments API v3 – Payment Status, Payment Request Status, Payment Session Completed, dan Payment Session Expired di Xendit Dashboard ke endpoint installation, lalu isi webhook token. Secret tidak pernah dikembalikan API.
url: "{{base_url}}/api/v1/provider-installations/{{installation_id}}/credentials"
method: PUT
headers:
  X-Emisell-Merchant-ID: "{{merchant_id}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "credentials": {
        "api_key": "{{xendit_api_key}}",
        "webhook_verification_token": "{{xendit_webhook_token}}"
      },
      "payment_methods": []
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Credential configured', () => pm.expect(pm.response.code).to.eql(200));
      if (pm.response.code === 200) pm.collectionVariables.set('installation_version', String(pm.response.json().data.version));
    language: text/javascript
examples: ./.resources/2. Configure credentials.resources/examples
order: 2000
