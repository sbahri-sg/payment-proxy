$kind: http-request
description: Rotasi hanya field credential yang berubah. Field lain tetap dibaca dari vault, seluruh gabungan diverifikasi ulang, dan secret tidak pernah dikembalikan. Deactivate installation ACTIVE sebelum rotasi.
url: "{{base_url}}/api/v1/provider-installations/{{installation_id}}/credentials"
method: PATCH
headers:
  X-Emisell-Merchant-ID: "{{merchant_id}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "credentials": {
        "api_key": "{{xendit_api_key}}"
      }
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Credential rotated", () => pm.expect(pm.response.code).to.eql(200));
      if (pm.response.code === 200) pm.collectionVariables.set('installation_version', String(pm.response.json().data.version));
    language: text/javascript
examples: ./.resources/3. Edit credentials (partial rotation).resources/examples
order: 3000
