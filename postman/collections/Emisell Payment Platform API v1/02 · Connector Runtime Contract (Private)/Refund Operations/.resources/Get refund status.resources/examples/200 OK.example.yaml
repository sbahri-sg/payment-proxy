$kind: http-example
request:
  url: "{{partner_base_url}}/partner/v1/refunds/get"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "provider_code": "{{provider_code}}",
        "environment": "{{execution_mode}}",
        "credentials": {"api_key": "{{provider_secret}}"},
        "refund_id": "{{provider_refund_id}}"
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: |-
      {
        "data": { "id": "{{provider_refund_id}}", "status": "SUCCEEDED" }
      }
order: 1000
