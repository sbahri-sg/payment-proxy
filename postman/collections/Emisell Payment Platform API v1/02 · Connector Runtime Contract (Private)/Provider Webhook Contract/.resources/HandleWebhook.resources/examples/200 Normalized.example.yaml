$kind: http-example
request:
  url: "{{partner_base_url}}/partner/v1/webhooks/normalize"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "provider_code": "{{provider_code}}",
        "credentials": {"webhook_verification_token": "{{xendit_webhook_token}}"},
        "headers": {"webhook-id": ["{{webhook_id}}"], "x-callback-token": ["{{xendit_webhook_token}}"]},
        "body": "eyJldmVudCI6InBheW1lbnQuY2FwdHVyZSJ9"
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: |-
      {
        "data": {
          "id": "{{webhook_id}}",
          "type": "payment.updated",
          "payment_id": "{{provider_payment_id}}",
          "status": "SUCCEEDED"
        }
      }
order: 1000
