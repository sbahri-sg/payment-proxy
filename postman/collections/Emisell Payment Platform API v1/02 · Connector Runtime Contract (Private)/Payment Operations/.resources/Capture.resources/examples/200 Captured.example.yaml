$kind: http-example
request:
  url: "{{partner_base_url}}/partner/v1/payments/capture"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "provider_code": "{{provider_code}}",
        "environment": "{{execution_mode}}",
        "credentials": {"api_key": "{{provider_secret}}"},
        "payment_id": "{{provider_payment_id}}",
        "idempotency_key": "capture-payment-123-attempt-1",
        "amount": 1000000,
        "currency": "IDR"
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: |-
      {
        "data": { "id": "{{provider_payment_id}}", "status": "SUCCEEDED" }
      }
order: 1000
