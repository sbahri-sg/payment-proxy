$kind: http-request
url: "{{partner_base_url}}/partner/v1/installations/disable"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "installation_id": "{{installation_id}}",
      "provider_code": "{{provider_code}}",
      "environment": "{{execution_mode}}",
      "credentials": {}
    }
examples: ./.resources/Disable installation.resources/examples
order: 2000
