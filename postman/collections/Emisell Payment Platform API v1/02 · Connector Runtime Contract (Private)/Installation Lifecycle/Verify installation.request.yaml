$kind: http-request
description: ACTIVE. Secret hanya diproses pada isolated Connector Runner, tidak dicatat, dan tidak dikembalikan pada response.
url: "{{partner_base_url}}/partner/v1/installations/verify"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "installation_id": "{{installation_id}}",
      "provider_code": "{{provider_code}}",
      "environment": "{{execution_mode}}",
      "credentials": {"api_key": "{{provider_secret}}"},
      "public_webhook_url": "{{base_url}}/webhooks/v1/providers/{{provider_code}}/{{installation_id}}"
    }
examples: ./.resources/Verify installation.resources/examples
order: 1000
