$kind: http-example
request:
  url: "{{partner_base_url}}/partner/v1/installations/disable"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "installation_id": "{{installation_id}}",
        "provider_code": "{{provider_code}}",
        "environment": "{{execution_mode}}",
        "credentials": {}
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: |-
      {
        "data": { "disabled": true }
      }
order: 1000
