$kind: http-request
description: Installation harus INACTIVE. Target harus RELEASED dan sama dengan manifest runtime aktif; credential tetap tersimpan terenkripsi. Setelah response READY, aktifkan kembali dengan version terbaru.
url: "{{base_url}}/api/v1/provider-installations/{{installation_id}}/upgrade"
method: POST
headers:
  X-Emisell-Merchant-ID: "{{merchant_id}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "version": {{installation_version}},
      "provider_version": "{{target_provider_version}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Installation ready on target release', () => pm.expect(pm.response.json().data.status).to.eql('READY'));
      if (pm.response.code === 200) pm.collectionVariables.set('installation_version', String(pm.response.json().data.version));
    language: text/javascript
examples: ./.resources/5. Upgrade Provider App.resources/examples
order: 1000
