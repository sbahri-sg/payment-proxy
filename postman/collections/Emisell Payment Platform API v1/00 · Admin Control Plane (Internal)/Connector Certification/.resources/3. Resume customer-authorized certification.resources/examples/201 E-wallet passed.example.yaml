$kind: http-example
request:
  url: "{{base_url}}/api/v1/connector-certifications/run"
  method: POST
  headers:
    X-Emisell-Merchant-ID: "{{merchant_id}}"
    X-Emisell-Execution-Mode: sandbox
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "installation_id": "{{installation_id}}",
        "payment_method_code": "{{payment_method_code}}",
        "payment_id": "{{payment_id}}"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": {
          "id": "cert_01k3...",
          "provider_code": "xendit",
          "payment_method_code": "ewallet_dana",
          "status": "PASSED",
          "payment_id": "pay_01k3...",
          "message": "Provider customer authorization, webhook processing, and Emisell delivery passed; the method is certified for checkout."
        }
      }
order: 1000
