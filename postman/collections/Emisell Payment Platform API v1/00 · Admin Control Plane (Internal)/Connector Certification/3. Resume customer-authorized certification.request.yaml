$kind: http-request
description: Setelah redirect atau mobile authorization sandbox selesai, verifikasi provider status, provider webhook, dan signed Emisell delivery untuk payment yang sama. Endpoint ini tidak membuat payment baru.
url: "{{base_url}}/api/v1/connector-certifications/run"
method: POST
headers:
  X-Emisell-Merchant-ID: "{{merchant_id}}"
  X-Emisell-Execution-Mode: sandbox
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "installation_id": "{{installation_id}}",
      "payment_method_code": "{{payment_method_code}}",
      "payment_id": "{{payment_id}}"
    }
examples: ./.resources/3. Resume customer-authorized certification.resources/examples
order: 3000
