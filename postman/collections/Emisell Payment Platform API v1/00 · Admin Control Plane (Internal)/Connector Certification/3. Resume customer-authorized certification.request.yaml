$kind: http-request
description: Resume diagnostic internal setelah redirect/mobile authorization sandbox. Endpoint ini tidak membuat payment baru.
url: "{{base_url}}/api/v1/admin/connector-certifications/run"
method: POST
headers:
  X-Admin-API-Key: "{{admin_api_key}}"
  X-Emisell-Merchant-ID: "{{merchant_id}}"
  X-Emisell-Execution-Mode: sandbox
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "installation_id": "{{installation_id}}",
      "payment_method_code": "{{payment_method_code}}",
      "payment_id": "{{payment_id}}"
    }
auth:
  type: noauth
examples: ./.resources/3. Resume customer-authorized certification.resources/examples
order: 3000
