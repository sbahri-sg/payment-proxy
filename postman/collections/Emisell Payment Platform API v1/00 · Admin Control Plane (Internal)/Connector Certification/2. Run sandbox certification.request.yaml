$kind: http-request
description: Diagnostic CI/internal untuk create, retrieve, customer action, provider webhook, dan signed delivery pada test tenant. Bukan tahap installation merchant.
url: "{{base_url}}/api/v1/admin/connector-certifications/run"
method: POST
headers:
  X-Admin-API-Key: "{{admin_api_key}}"
  X-Emisell-Merchant-ID: "{{merchant_id}}"
  X-Emisell-Execution-Mode: sandbox
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "installation_id": "{{installation_id}}",
      "payment_method_code": "{{payment_method_code}}"
    }
auth:
  type: noauth
examples: ./.resources/2. Run sandbox certification.resources/examples
order: 2000
