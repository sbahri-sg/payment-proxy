  statusText: Created
  body:
    type: text
    content: |-
      {
        "data": {
          "id": "papp_01k...",
          "provider_code": "midtrans",
          "provider_name": "Midtrans",
          "version": "0.1.0",
          "status": "UPLOADED",
          "runtime": "isolated_container",
          "artifact_sha256": "a791f4...9d2c",
          "scan_report": { "passed": true, "file_count": 3 }
        }
      }
order: 1000
