$kind: http-request
description: Provider code menjadi identitas permanen. Logo opsional disimpan di database; nama dan code manifest ZIP berikutnya wajib cocok.
url: "{{base_url}}/api/v1/admin/provider-app-providers"
method: POST
headers:
  X-Admin-API-Key: "{{admin_api_key}}"
body:
  type: formdata
  content:
    - type: text
      key: provider_code
      value: "{{provider_app_code}}"
    - type: text
      key: provider_name
      value: Connector Demo
    - type: text
      key: description
      value: Provider connector registered before ZIP submission.
    - type: text
      key: website_url
      value: https://example.com
    - type: text
      key: documentation_url
      value: https://example.com/docs
    - type: text
      key: support_email
      value: support@example.com
    - type: file
      key: logo
      src:
        - ""
      description: Optional PNG/JPG maksimum 512 KB dan 2048×2048 piksel
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Provider created', () => pm.expect(pm.response.code).to.eql(201));
      if (pm.response.code === 201) pm.collectionVariables.set('provider_app_code', pm.response.json().data.provider_code);
    language: text/javascript
examples: ./.resources/1. Create Provider.resources/examples
order: 1000
