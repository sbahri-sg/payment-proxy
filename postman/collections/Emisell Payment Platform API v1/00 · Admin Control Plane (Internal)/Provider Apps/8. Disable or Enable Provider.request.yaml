$kind: http-request
description: Menonaktifkan provider untuk installation baru tanpa menghapus release, installation, transaksi, webhook, atau audit historis.
url: "{{base_url}}/api/v1/admin/provider-app-providers/{{provider_app_code}}/transition"
method: POST
headers:
  X-Admin-API-Key: "{{admin_api_key}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "expected_status": "ACTIVE",
      "status": "DISABLED"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Provider registry transitioned', () => pm.expect(pm.response.code).to.eql(200));
    language: text/javascript
order: 8000
