$kind: http-request
description: Returns a whsec_ plaintext once, stores only AES-GCM ciphertext, and disables delivery during rotation. Copy the secret immediately to Emisell Backend.
url: "{{base_url}}/api/v1/admin/emisell-webhook/secret"
method: POST
headers:
  X-Admin-API-Key: "{{admin_api_key}}"
auth:
  type: noauth
examples: ./.resources/Generate or rotate Emisell webhook secret.resources/examples
order: 3000
