$kind: http-example
request:
  url: "{{base_url}}/health/ready"
  method: GET
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "ready",
        "checks": {
          "database": "ok",
          "emisell_engine": "ok"
        }
      }
order: 1000
